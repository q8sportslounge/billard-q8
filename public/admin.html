<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Q8 Admin" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Q8 Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Phudu:wght@700;900&family=Roboto+Flex:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { background:#0a0a0a !important; color:#fff; font-family:'Roboto Flex',sans-serif; min-height:100vh; }
    h1,h2,h3 { font-family:'Phudu',sans-serif; }

    #login { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; background:#0a0a0a; }
    .login-box { background:#111; border:1px solid #1e1e1e; border-radius:16px; padding:36px 28px; width:100%; max-width:360px; }
    .login-logo { text-align:center; margin-bottom:28px; }
    .login-logo h1 { font-size:32px; font-weight:900; color:#fff; }
    .login-logo span { color:#4a9c2f; }
    .login-logo p { font-size:11px; color:#555; margin-top:4px; letter-spacing:0.12em; text-transform:uppercase; }
    .login-input { width:100%; background:#1a1a1a; border:2px solid #222; color:#fff; border-radius:10px; padding:14px 16px; font-size:16px; margin-bottom:12px; outline:none; font-family:'Roboto Flex',sans-serif; }
    .login-input:focus { border-color:#4a9c2f; }
    .btn-primary { width:100%; background:#4a9c2f; color:#fff; border:none; border-radius:10px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; font-family:'Roboto Flex',sans-serif; }

    #app { display:none; background:#0a0a0a; min-height:100vh; }
    .header { background:#111; border-bottom:1px solid #1e1e1e; padding:16px 20px; padding-top:calc(16px + env(safe-area-inset-top)); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
    .header h1 { font-size:20px; font-weight:900; }
    .header span { color:#4a9c2f; }
    .logout-btn { background:transparent; border:1px solid #333; color:#666; border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:'Roboto Flex',sans-serif; }

    .nav { display:flex; background:#111; border-bottom:1px solid #1e1e1e; }
    .nav-btn { flex:1; background:transparent; border:none; color:#555; padding:14px 8px; font-size:11px; font-weight:700; cursor:pointer; letter-spacing:0.08em; text-transform:uppercase; font-family:'Roboto Flex',sans-serif; border-bottom:2px solid transparent; transition:all 0.2s; }
    .nav-btn.active { color:#4a9c2f; border-bottom-color:#4a9c2f; }

    .content { padding:20px; max-width:680px; margin:0 auto; }

    .day-nav { display:flex; gap:8px; margin-bottom:20px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
    .day-chip { background:#111; border:2px solid #1e1e1e; color:#fff; border-radius:20px; padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:'Roboto Flex',sans-serif; flex-shrink:0; }
    .day-chip.active { background:#4a9c2f; border-color:#4a9c2f; }

    .booking-card { background:#111; border:1px solid #1e1e1e; border-radius:12px; padding:16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .booking-card.blocked { background:#1a0808; border-color:#ff4444; }
    .booking-time { font-size:22px; font-weight:900; font-family:'Phudu',sans-serif; color:#4a9c2f; min-width:65px; }
    .booking-card.blocked .booking-time { color:#ff4444; }
    .booking-info { flex:1; min-width:0; }
    .booking-name { font-size:15px; font-weight:700; margin-bottom:4px; }
    .booking-meta { font-size:12px; color:#555; line-height:1.7; }
    .booking-badge { display:inline-block; background:#0f1a07; color:#4a9c2f; border:1px solid #2d6b1a; border-radius:20px; padding:2px 8px; font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:5px; }
    .booking-badge.blocked { background:#1a0808; color:#ff4444; border-color:#ff4444; }
    .btn-delete { background:transparent; border:1px solid #ff4444; color:#ff4444; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:'Roboto Flex',sans-serif; white-space:nowrap; flex-shrink:0; }

    .empty { text-align:center; padding:48px 20px; color:#444; }
    .empty-icon { font-size:40px; margin-bottom:12px; }
    .empty p { font-size:14px; line-height:1.6; }
    .loading { text-align:center; padding:40px; color:#555; font-size:14px; }

    .section-label { font-size:11px; font-weight:700; color:#4a9c2f; letter-spacing:0.15em; text-transform:uppercase; margin-bottom:12px; }
    .form-group { margin-bottom:14px; }
    .form-label { font-size:11px; font-weight:700; color:#4a9c2f; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:6px; display:block; }
    .form-input, .form-select { width:100%; background:#111; border:2px solid #1e1e1e; color:#fff; border-radius:10px; padding:13px 16px; font-size:15px; outline:none; font-family:'Roboto Flex',sans-serif; }
    .form-input:focus { border-color:#4a9c2f; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .btn-add { width:100%; background:#4a9c2f; color:#fff; border:none; border-radius:10px; padding:16px; font-size:15px; font-weight:700; cursor:pointer; font-family:'Roboto Flex',sans-serif; margin-top:8px; }

    .slot-grid { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
    .slot-btn { background:#111; border:2px solid #1e1e1e; color:#fff; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:'Roboto Flex',sans-serif; }
    .slot-btn:active { border-color:#ff4444; color:#ff4444; }
    .type-btn { background:#111; border:2px solid #1e1e1e; color:#fff; border-radius:12px; padding:14px 8px; font-size:22px; cursor:pointer; font-family:"Roboto Flex",sans-serif; line-height:1.4; transition:all 0.15s; }
    .type-btn span { display:block; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#555; margin-top:4px; }
    .type-btn.active { border-color:#4a9c2f; background:#0f1a07; }
    .type-btn.active span { color:#4a9c2f; }
    .divider { height:1px; background:#1e1e1e; margin:20px 0; }

    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#4a9c2f; color:#fff; border-radius:10px; padding:12px 20px; font-size:14px; font-weight:700; z-index:9999; white-space:nowrap; pointer-events:none; }
    .toast.red { background:#ff4444; }
  </style>
</head>

const DAY_NAMES = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MONTH_SHORT = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];

function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayStr() { return fmtDate(new Date()); }
function fmtHour(h) { return `${String(h>=24?h-24:h).padStart(2,'0')}:00`; }

async function sb(method, path, body=null) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      method,
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": method==="POST"?"return=representation":"" },
      body: body ? JSON.stringify(body) : null
    });
    if (method === "DELETE") return true;
    const text = await res.text();
    return text ? JSON.parse(text) : [];
  } catch(e) { console.error(e); return []; }
}


function getBadgeLabel(art) {
  if (!art) return '🎱 Billard';
  if (art === 'tag') return '⚡ Billard Tag';
  if (art === 'dart') return '🎯 Dart';
  if (art === 'tisch' || art.startsWith('tisch-')) return '🍽️ Tisch';
  return '🎱 Billard';
}
function getBadgeClass(art) {
  return '';
}
function getResourceLabel(art, table_id) {
  if (art === 'dart') return `Scheibe ${table_id}`;
  if (art === 'tisch' || (art && art.startsWith('tisch-'))) return `Tisch ${table_id}`;
  return `Billardtisch ${table_id}`;
}

function showToast(msg, red=false) {
  const t = document.createElement('div');
  t.className = 'toast' + (red?' red':'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function doLogin() {
  if (document.getElementById('pwInput').value === ADMIN_PW) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    showToast('Falsches Passwort', true);
  }
}

function doLogout() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('pwInput').value = '';
}

function showTab(tab) {
  ['calendar','add','block'].forEach(t => {
    document.getElementById(`panel-${t}`).style.display = t===tab?'block':'none';
    document.getElementById(`tab-${t}`).classList.toggle('active', t===tab);
  });
  if (tab==='block') renderBlockPanel();
}

let currentDate = todayStr();

function initApp() {
  buildDayNav();
  loadCalendar(currentDate);
  document.getElementById('addDate').value = todayStr();
  document.getElementById('blockDate').value = todayStr();
  buildHourSelect();
}

function buildDayNav() {
  const nav = document.getElementById('dayNav');
  nav.innerHTML = '';
  for (let i=-1; i<=6; i++) {
    const d = new Date(); d.setDate(d.getDate()+i);
    const ds = fmtDate(d);
    const chip = document.createElement('button');
    chip.className = 'day-chip'+(ds===currentDate?' active':'');
    chip.textContent = i===0?'Heute':i===1?'Morgen':`${DAY_NAMES[d.getDay()]} ${d.getDate()}. ${MONTH_SHORT[d.getMonth()]}`;
    chip.onclick = () => {
      document.querySelectorAll('.day-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      currentDate = ds;
      loadCalendar(ds);
    };
    nav.appendChild(chip);
  }
}

async function loadCalendar(date) {
  const list = document.getElementById('bookingList');
  list.innerHTML = '<div class="loading">Lädt...</div>';
  const data = await sb('GET', `bookings?date=eq.${date}&order=hour.asc&select=*`);
  if (!Array.isArray(data) || data.length===0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>Keine Buchungen für diesen Tag.</p></div>';
    return;
  }
  // Deduplicate: show each unique booking once (not per hour)
  const seen = new Set();
  const unique = data.filter(b => {
    const key = b.blocked ? `blocked-${b.hour}` : `${b.name}-${b.hour}`;
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });
  list.innerHTML = unique.map(b => `
    <div class="booking-card ${b.blocked?'blocked':''}">
      <div class="booking-time">${fmtHour(b.hour)}</div>
      <div class="booking-info">
        <div class="booking-badge ${b.blocked?'blocked':getBadgeClass(b.buchungsart)}">${b.blocked?'GESPERRT':getBadgeLabel(b.buchungsart)}</div>
        <div class="booking-name">${b.blocked?'Gesperrt':b.name||'—'}</div>
        <div class="booking-meta">${b.blocked?'':`${b.persons||1} Pers.${b.price?` · ${b.price}€`:''}${b.table_id?' · '+getResourceLabel(b.buchungsart,b.table_id):''}<br>${b.phone||''} ${b.email?'· '+b.email:''}`}</div>
      </div>
      <button class="btn-delete" onclick="deleteBooking(${b.id},'${date}')">Löschen</button>
    </div>
  `).join('');
}

async function deleteBooking(id, date) {
  if (!confirm('Buchung wirklich löschen?')) return;
  await sb('DELETE', `bookings?id=eq.${id}`);
  showToast('Gelöscht ✓');
  loadCalendar(date||currentDate);
}

function buildHourSelect() {
  const sel = document.getElementById('addHour');
  for (let h=14; h<=23; h++) {
    const o = document.createElement('option');
    o.value=h; o.textContent=fmtHour(h); sel.appendChild(o);
  }
}

let currentType = 'billard';

function selectType(type) {
  currentType = type;
  ['billard','dart','tisch'].forEach(t => {
    document.getElementById(`type-${t}`).classList.toggle('active', t===type);
    const opts = document.getElementById(`${t}-options`);
    if (opts) opts.style.display = t===type ? 'block' : 'none';
  });
}

async function addBooking() {
  const date = document.getElementById('addDate').value;
  const hour = parseInt(document.getElementById('addHour').value);
  const duration = parseInt(document.getElementById('addDuration').value);
  const name = document.getElementById('addName').value.trim();
  const phone = document.getElementById('addPhone').value.trim();
  const note = document.getElementById('addNote').value.trim();

  if (!date||!name||!phone) { showToast('⚠️ Name + Telefon erforderlich!', true); return; }

  let persons=2, buchungsart=currentType, price=0, table_id=1;

  if (currentType==='billard') {
    persons = parseInt(document.getElementById('addPersons').value);
    buchungsart = document.getElementById('addBuchungsart').value;
    const prices = {normal:{1:12,2:24},tag:{1:9,2:18}};
    price = prices[buchungsart]?.[duration] || 12;
    // Check billard availability
    const existing = await sb('GET', `bookings?date=eq.${date}&buchungsart=neq.dart&buchungsart=neq.tisch&select=hour,table_id`);
    const getBooked = h => new Set((Array.isArray(existing)?existing:[]).filter(b=>b.hour===h).map(b=>b.table_id));
    let free = null;
    for (let h=0; h<duration; h++) {
      const booked = getBooked(hour+h);
      const f = TABLES.find(t=>!booked.has(t));
      if (!f) { showToast('⚠️ Kein Billardtisch frei!', true); return; }
      if (h===0) free=f;
    }
    table_id = free;
  } else if (currentType==='dart') {
    persons = parseInt(document.getElementById('addPersonsDart').value);
    price = 0;
    // Check dart availability (2 boards = table_id 1 or 2)
    const existing = await sb('GET', `bookings?date=eq.${date}&buchungsart=eq.dart&select=hour,table_id`);
    const getBooked = h => new Set((Array.isArray(existing)?existing:[]).filter(b=>b.hour===h).map(b=>b.table_id));
    let free = null;
    for (let h=0; h<duration; h++) {
      const booked = getBooked(hour+h);
      const f = [1,2].find(t=>!booked.has(t));
      if (!f) { showToast('⚠️ Keine Dartscheibe frei!', true); return; }
      if (h===0) free=f;
    }
    table_id = free;
  } else if (currentType==='tisch') {
    persons = parseInt(document.getElementById('addPersonsTisch').value);
    const anlass = document.getElementById('addAnlass').value.trim();
    const tischNr = document.getElementById('addTischNr').value;
    buchungsart = anlass ? `tisch-${anlass}` : 'tisch';
    price = 0;
    table_id = tischNr ? parseInt(tischNr) : 1;
  }

  for (let h=0; h<duration; h++) {
    await sb('POST','bookings',{date,hour:hour+h,duration,table_id,name,phone,email:'',persons,price,buchungsart,blocked:false,note});
  }
  showToast(`✅ ${name} gespeichert!`);
  document.getElementById('addName').value='';
  document.getElementById('addPhone').value='';
  document.getElementById('addNote').value='';
  if (date===currentDate) loadCalendar(currentDate);
}

async function renderBlockPanel() {
  const date = document.getElementById('blockDate').value;
  if (!date) return;
  const dow = new Date(date+'T12:00:00').getDay();
  const hc = OPENING_HOURS[dow];
  const slotsEl = document.getElementById('blockSlots');
  const blockedEl = document.getElementById('blockedList');
  if (!hc) { slotsEl.innerHTML='<p style="color:#555;font-size:13px">Geschlossen.</p>'; blockedEl.innerHTML=''; return; }

  const data = await sb('GET', `bookings?date=eq.${date}&select=*`);
  const booked_hours = new Set((Array.isArray(data)?data:[]).map(b=>b.hour));

  slotsEl.innerHTML='';
  for (let h=hc.open; h<hc.close; h++) {
    const btn = document.createElement('button');
    btn.className='slot-btn';
    btn.textContent=fmtHour(h);
    btn.style.opacity = booked_hours.has(h)?'0.4':'1';
    btn.onclick = () => blockSlot(date,h);
    slotsEl.appendChild(btn);
  }

  const blocked = (Array.isArray(data)?data:[]).filter(b=>b.blocked);
  blockedEl.innerHTML = blocked.length===0
    ? '<p style="color:#555;font-size:13px">Keine gesperrten Slots.</p>'
    : blocked.map(b=>`
      <div class="booking-card blocked" style="margin-bottom:8px">
        <div class="booking-time" style="color:#ff4444">${fmtHour(b.hour)}</div>
        <div class="booking-info"><div class="booking-badge blocked">GESPERRT</div></div>
        <button class="btn-delete" onclick="unblockSlot(${b.id},'${date}')">Freigeben</button>
      </div>`).join('');
}

async function blockSlot(date, hour) {
  await sb('POST','bookings',{date,hour,duration:1,table_id:1,name:'GESPERRT',blocked:true});
  showToast(`⛔ ${fmtHour(hour)} gesperrt`);
  renderBlockPanel();
}

async function unblockSlot(id, date) {
  await sb('DELETE', `bookings?id=eq.${id}`);
  showToast('✅ Slot freigegeben');
  renderBlockPanel();
}
</script>
